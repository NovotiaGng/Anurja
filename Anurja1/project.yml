name: Anurja
options:
  bundleIdPrefix: com.novotia
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  developmentLanguage: en
  knownRegions:
    - en
    - hi
    - ta
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_PREVIEWS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Anurja:
    type: application
    platform: iOS
    sources:
      - path: Anurja
        excludes:
          - Info.plist
          - Anurja.entitlements
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.novotia.anurja
        PRODUCT_NAME: Anurja
        INFOPLIST_FILE: Anurja/Info.plist
        CODE_SIGN_ENTITLEMENTS: Anurja/Anurja.entitlements
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: AnurjaWidget
        embed: true
      - target: AnurjaWatch
        embed: true
    scheme:
      gatherCoverageData: false
      testTargets:
        - AnurjaUITests
  AnurjaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AnurjaUITests
    dependencies:
      - target: Anurja
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.novotia.anurja.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Anurja
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
  AnurjaWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: AnurjaWidget
        excludes:
          - Info.plist
          - AnurjaWidget.entitlements
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.novotia.anurja.widget
        PRODUCT_NAME: AnurjaWidget
        INFOPLIST_FILE: AnurjaWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: AnurjaWidget/AnurjaWidget.entitlements
        GENERATE_INFOPLIST_FILE: NO
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
    scheme:
      gatherCoverageData: false
  AnurjaWatch:
    type: application
    platform: watchOS
    sources:
      - path: AnurjaWatch
        excludes:
          - Info.plist
          - AnurjaWatch.entitlements
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.novotia.anurja.watchkitapp
        PRODUCT_NAME: AnurjaWatch
        INFOPLIST_FILE: AnurjaWatch/Info.plist
        CODE_SIGN_ENTITLEMENTS: AnurjaWatch/AnurjaWatch.entitlements
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "4"
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        SDKROOT: watchos
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES
    dependencies:
      - target: AnurjaWatchWidget
        embed: true
    scheme:
      gatherCoverageData: false
  AnurjaWatchWidget:
    type: app-extension
    platform: watchOS
    sources:
      - path: AnurjaWatchWidget
        excludes:
          - Info.plist
          - AnurjaWatchWidget.entitlements
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.novotia.anurja.watchkitapp.widget
        PRODUCT_NAME: AnurjaWatchWidget
        INFOPLIST_FILE: AnurjaWatchWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: AnurjaWatchWidget/AnurjaWatchWidget.entitlements
        GENERATE_INFOPLIST_FILE: NO
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        SDKROOT: watchos
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "4"
