<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anurja – iPhone preview</title>
<style>
:root{--page:#E9E1D8;--cream:#FAF3EB;--terra:#AA5A43;--maroon:#7A1F2B;--forest:#3B5B4B;--sage:#5E7466;--sand:#EEE2D6;--blush:#E0BBA8;--ink:#2E241F;--muted:#8A7B70;--note:#5b4d44;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#1d1815;--note:#d9cdc2}}
:root[data-theme="dark"]{--page:#1d1815;--note:#d9cdc2}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100%;background:var(--page);font-family:-apple-system,"SF Pro Text","Inter",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:12px}
.note{color:var(--note);font-size:13px;text-align:center;max-width:390px}
#wrap{flex:none}.phone{width:390px;height:800px;transform-origin:top left;border-radius:56px;background:#111;padding:11px;box-shadow:0 0 0 2px #8a8a8f,0 24px 50px rgba(0,0,0,.35);position:relative}
.screen{position:relative;width:100%;height:100%;border-radius:46px;overflow:hidden;background:var(--cream);color:var(--ink)}
.island{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:104px;height:30px;border-radius:20px;background:#000;z-index:30}
.status{position:absolute;top:14px;left:30px;right:30px;display:flex;justify-content:space-between;font-size:14px;font-weight:600;z-index:25;pointer-events:none}
.view{position:absolute;inset:0;display:flex;flex-direction:column}
.scroll{flex:1;overflow-y:auto;padding:56px 18px 112px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.warm{background:linear-gradient(180deg,#AA5A43 0%,#D9A68F 45%,#3B5B4B 100%);color:var(--cream)}
.warm:before{content:"";position:absolute;width:300px;height:300px;border-radius:50%;background:rgba(94,116,102,.75);right:-110px;top:-100px}
.pad{position:relative;flex:1;padding:58px 22px 20px;display:flex;flex-direction:column;overflow-y:auto;scrollbar-width:none}.pad::-webkit-scrollbar{display:none}
h1{font-family:"Lora","Iowan Old Style",Georgia,serif;font-size:36px;line-height:1.08;margin:0}
h2{font-size:30px;line-height:1.1;margin:0}
.sub{font-size:15px;color:var(--muted);margin:6px 0 0}
.btn{display:flex;justify-content:space-between;align-items:center;width:100%;height:58px;border:0;border-radius:30px;background:var(--terra);color:#fff;font:600 17px inherit;font-family:inherit;padding:0 26px;cursor:pointer}
.btn[disabled]{opacity:.45}
.opt{display:flex;align-items:center;gap:14px;width:100%;background:#fff;border:2px solid transparent;border-radius:26px;padding:12px;text-align:left;font-family:inherit;color:var(--ink);cursor:pointer;margin-bottom:12px}
.opt.on{border-color:var(--terra)}
.ico{width:54px;height:54px;border-radius:16px;background:rgba(224,187,168,.6);display:grid;place-items:center;font-size:24px;flex:none}
.opt b{display:block;font-size:17px}.opt small{color:var(--muted);font-size:13px}
.radio{margin-left:auto;width:28px;height:28px;border-radius:50%;border:2px solid var(--terra);display:grid;place-items:center;color:#fff;flex:none}
.on .radio{background:var(--terra)}
.card{background:#fff;border:1px solid var(--sand);border-radius:22px;padding:14px;margin-top:12px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.chip{border:1.5px solid var(--sand);background:transparent;border-radius:20px;padding:8px 14px;font:14px inherit;font-family:inherit;color:var(--ink);cursor:pointer}
.chip.on{background:var(--terra);border-color:var(--terra);color:#fff}
.chip.g.on{background:var(--forest);border-color:var(--forest)}
.seg{display:flex;background:var(--sand);border-radius:24px;padding:4px;margin-top:12px}
.seg button{flex:1;border:0;background:none;height:40px;border-radius:20px;font:15px inherit;font-family:inherit;color:var(--muted);cursor:pointer}
.seg button.on{background:#fff;color:var(--ink);font-weight:600}
.tabbar{display:flex;justify-content:space-around;padding:8px 6px 22px;background:#fff;border-top:1px solid var(--sand)}
.tabbar button{border:0;background:none;font-family:inherit;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:4px 8px;border-radius:16px}
.tabbar button span{font-size:20px}.tabbar button.on{color:var(--terra);background:var(--cream)}
.head{display:flex;justify-content:space-between;align-items:baseline}
.logo{font:italic 500 20px "Lora",Georgia,serif;color:var(--terra)}
.big{font-size:54px;font-weight:700;line-height:1}
.row{display:flex;gap:10px}.row>*{flex:1}
.stat b{font-size:24px;display:block}.stat small{color:var(--muted);font-size:12px}
.plan{background:var(--terra);color:#fff;border-radius:26px;padding:18px;margin-top:12px}
.plan hr{border:0;border-top:1px solid rgba(255,255,255,.4);margin:12px 0}
.bar{height:8px;background:var(--sand);border-radius:6px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--terra)}
.q{display:flex;gap:10px;align-items:center;padding:7px 0;font-size:15px}
.dev{display:flex;align-items:center;gap:14px;background:var(--cream);border-radius:28px;padding:14px;margin-top:14px}
.dev .ico{width:60px;height:60px;background:rgba(224,187,168,.8)}
.dev b{font-weight:500;font-size:18px;color:var(--ink);display:block}.dev small{color:var(--forest);font-size:13px}
.mini{margin-left:auto;border:0;background:var(--terra);color:#fff;border-radius:16px;padding:8px 14px;font:600 14px inherit;font-family:inherit;cursor:pointer}
.dot{margin-left:auto;width:22px;height:22px;border-radius:50%;background:var(--terra)}
.overlay{position:absolute;inset:0;background:var(--cream);z-index:20;display:flex;flex-direction:column}
.ins{display:flex;gap:12px;align-items:flex-start}.ins .ico{width:44px;height:44px;font-size:20px}
.dots i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--sand);margin-left:3px}.dots i.f{background:var(--terra)}
.dark{background:#2E3A33;border-radius:26px;margin-top:12px;color:#fff;text-align:center;padding:10px 10px 14px;position:relative}
.fb{display:inline-block;background:var(--terra);border-radius:20px;padding:8px 16px;font-weight:600;font-size:15px}
.x{border:0;background:#fff;width:40px;height:40px;border-radius:50%;font-size:16px;cursor:pointer}
.tiny{font-size:12px;color:var(--muted);margin-top:10px}
.nav{position:absolute;left:12px;right:12px;bottom:16px;display:flex;gap:8px;align-items:center;z-index:15}
.pill{display:flex;background:#24382E;border-radius:40px;padding:5px;box-shadow:0 6px 14px rgba(0,0,0,.2)}
.pill button{width:66px;height:66px;border-radius:50%;border:0;background:none;color:#FAF3EB;font:12px inherit;font-family:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;transition:background .25s}
.pill button.on{background:var(--blush);color:var(--ink);font-weight:600}
.fab{width:64px;height:64px;border-radius:50%;border:0;background:var(--terra);color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 6px 14px rgba(0,0,0,.2)}
.menu{position:absolute;right:12px;bottom:92px;background:#fff;border:1px solid var(--sand);border-radius:20px;padding:6px;z-index:16;box-shadow:0 10px 24px rgba(0,0,0,.18)}
.menu button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;padding:12px 14px;font:15px inherit;font-family:inherit;color:var(--ink);border-radius:14px;cursor:pointer;text-align:left}
.prof{border:0;background:none;color:var(--terra);cursor:pointer;padding:0;line-height:0}
button:focus-visible{outline:3px solid var(--forest);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="note">Interactive preview of the Anurja SwiftUI prototype. Tap through it like the app. The real build has a live camera form check.</div>
<div id="wrap"><div class="phone" id="ph"><div class="screen" id="scr"><div class="island"></div><div class="status"><span>9:41</span><span>100%</span></div><div id="root" style="position:absolute;inset:0"></div></div></div></div>

<script>
const $=s=>document.querySelector(s);
const S={stage:0,tab:'home',gam:true,goal:'meals',watch:0,cgm:0,mealTab:0,food:'Rice & dal',dur:'10–20 min',ctx:['At my desk'],drink:'Water',sugar:0,feel:[],sleep:5.5,stress:'Medium',meals:[],xp:40,streak:3,variant:0,mins:5,ci:{did:'Yes',feel:'Lighter',eff:'Easy'},walks:0,sessions:0,saved:false,ov:null,coach:null,cm:0,fab:false,prof:false};
const FOODS=['Rice & dal','Idli / dosa','Roti & sabzi','Biryani','Salad & curd','Something else'];
const CTX=['At my desk','Screen on','On the move','Walked after','Lay down after'];
const EX={squat:{n:'Bodyweight squat',i:'🦵',b:'Big leg muscles soak up glucose. Side-on to the camera.',cues:['Feet shoulder-width','Sit back and down','Chest tall','Stand up fully'],more:'Go a little lower next time',ok:'Good depth, now stand tall'},
curl:{n:'Arm curl',i:'💪',b:'Light weights or a water bottle. Face the camera.',cues:['Elbows by your sides','Curl up slowly','Squeeze at the top','Lower with control'],more:'Curl a bit higher',ok:'Nice squeeze, lower slowly'},
press:{n:'Overhead press',i:'🙌',b:'Hands at shoulders, press up. Face the camera.',cues:['Hands at shoulders','Press straight up','Arms fully straight','Lower to shoulders'],more:'Lower your hands to shoulder level',ok:'Strong press, lower back down'}};
// glucose
const PTS=(()=>{const now=new Date(),o=[];const ev=[[8.5,52],[13,78],[16.5,28],[20.5,60]];for(let i=-96;i<=0;i++){const t=new Date(now.getTime()+i*900000),h=t.getHours()+t.getMinutes()/60;let v=104+5*Math.sin(h*.9)+2*Math.sin(i*1.7);for(const[m,a]of ev){const dt=(h-m+24)%24;if(dt<4)v+=a*(dt/.9)*Math.exp(1-dt/.9)}o.push(v)}return o})();
const cur=Math.round(PTS.at(-1)),tir=Math.round(PTS.filter(v=>v>=70&&v<=180).length/PTS.length*100),avg=Math.round(PTS.reduce((a,b)=>a+b)/PTS.length),hi=PTS.filter(v=>v>180).length;
const rise=Math.round(Math.max(...PTS.slice(-8))-Math.min(...PTS.slice(-8)));
const trend=PTS.at(-1)-PTS.at(-2)>3?'↗':PTS.at(-1)-PTS.at(-2)<-3?'↘':'→';
function chart(h,axes){const w=340,min=50,max=250,x=i=>i/(PTS.length-1)*w,y=v=>h-(v-min)/(max-min)*h;
 const d=PTS.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join(' ');
 let g=`<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none"><rect x="0" y="${y(180)}" width="${w}" height="${y(70)-y(180)}" fill="#3B5B4B" opacity=".09"/>`;
 if(axes)g+=`<text x="2" y="${y(180)-3}" font-size="9" fill="#8A7B70">180</text><text x="2" y="${y(70)-3}" font-size="9" fill="#8A7B70">70</text>`;
 return g+`<path d="${d}" fill="none" stroke="#AA5A43" stroke-width="2.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>`}
function star(sz){let p='';const R=sz/2,n=32;for(let i=0;i<n;i++){const a=i*2*Math.PI/n-Math.PI/2,r=i%2?R*.42:(i%4==0?R:R*.78);p+=(i?'L':'M')+(R+r*Math.cos(a)).toFixed(1)+' '+(R+r*Math.sin(a)).toFixed(1)}
 return `<svg viewBox="0 0 ${sz} ${sz}" width="${sz}" height="${sz}"><path d="${p}Z" fill="#3B5B4B"/><circle cx="${R}" cy="${R}" r="${sz*.21}" fill="#FAF3EB"/><circle cx="${R}" cy="${R}" r="${sz*.135}" fill="#7A1F2B"/></svg>`}
const ic=(p,z=24,w=1.8)=>`<svg viewBox="0 0 24 24" width="${z}" height="${z}" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const IC={home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',trends:'<path d="M6 20V11M12 20V4M18 20v-6"/>',meals:'<path d="M6 3v7a2 2 0 0 0 4 0V3M8 12v9M17 3c-2.5 2-2.5 7 0 9v9M17 3v9"/>',habits:'<path d="M5 19C5 10 10 5 20 4c0 10-5 15-14 15zM5 19l8-8"/>',user:'<circle cx="12" cy="12" r="10"/><circle cx="12" cy="10" r="3.2"/><path d="M5.8 18.5c1.4-2.4 3.7-3.3 6.2-3.3s4.8.9 6.2 3.3"/>',plus:'<path d="M12 5v14M5 12h14"/>',meal2:'<path d="M5 12h14l-1.5 6a2 2 0 0 1-2 1.5h-7a2 2 0 0 1-2-1.5zM9 8c0-1.5 1-1.5 1-3M14 8c0-1.5 1-1.5 1-3"/>',check:'<circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/>',lift:'<path d="M3 9v6M6 7v10M18 7v10M21 9v6M6 12h12"/>'};
const chip=(g,v,on,cls='')=>`<button class="chip ${cls} ${on?'on':''}" data-a="chip" data-g="${g}" data-v="${v}">${v}</button>`;
const opt=(a,v,ic,t,s,on)=>`<button class="opt ${on?'on':''}" data-a="${a}" data-v="${v}"><span class="ico">${ic}</span><span><b>${t}</b><small>${s}</small></span><span class="radio">${on?'✓':''}</span></button>`;
const lvl=Math.floor(S.xp/100)+1;
function tabbar(){const t=[['home','Home'],['trends','Trends'],['meals','Meals'],['habits','Habits']];return `<div class="nav"><div class="pill">${t.map(x=>`<button class="${S.tab==x[0]?'on':''}" data-a="tab" data-v="${x[0]}" aria-label="${x[1]}">${ic(IC[x[0]],22)}<span>${x[1]}</span></button>`).join('')}</div><button class="fab" data-a="fab" aria-label="Quick add">${ic(IC.plus,28,1.6)}</button></div>${S.fab?`<div class="menu"><button data-a="fabgo" data-v="meals">${ic(IC.meal2,20)}Log a meal</button><button data-a="fabgo" data-v="habits">${ic(IC.check,20)}Habit check-in</button><button data-a="fabgo" data-v="coach">${ic(IC.lift,20)}Coached exercise</button></div>`:''}`}
function hdr(t,s){const r=t=='Me'?`<button class="x" data-a="closeProf" aria-label="Close">✕</button>`:`<button class="prof" data-a="profile" aria-label="Profile">${ic(IC.user,38,1.5)}</button>`;return `<div class="head" style="align-items:flex-start"><h2>${t}</h2>${r}</div>${s?`<p class="sub">${s}</p>`:''}`}
function analyze(m){const I=[],G=[];
 if(m.dur=='Under 10 min'){I.push(['🐇','Eaten quickly','Meals under 10 minutes tend to give a faster, higher rise.',2]);G.push('Put your fork down between bites; aim for 15 minutes.')}
 if(m.ctx.includes('Screen on')||m.ctx.includes('On the move')){I.push(['📱','Distracted eating','Screens and eating on the move make it easier to miss fullness cues.',1]);G.push('Keep screens away for the first five minutes of the meal.')}
 if(m.sugar>0||m.drink=='Juice / soft drink'){I.push(['🧂','Sweet drink with the meal','Sugar in tea, juice or soft drinks reaches your blood quickly.',3]);G.push('Swap the sweet drink for water or unsweetened tea with this meal.')}
 if(m.ctx.includes('Lay down after'))I.push(['🛏️','Lying down right after','Staying still gives your muscles no chance to use the glucose.',2]);
 if(m.ctx.includes('Walked after'))I.push(['🚶','You walked afterwards','Light movement after eating usually flattens the curve. Nicely done.',1]);else G.push('Take a 5-minute walk within 30 minutes after eating.');
 if(m.sleep<6)I.push(['🌙','Short sleep','A night under 6 hours can make your body respond less smoothly to food.',2]);
 if(m.stress=='High'){I.push(['〰️','High stress today','Stress hormones can nudge glucose up on their own.',2]);G.push('Three slow breaths before eating can help you settle.')}
 if(['Biryani','Rice & dal','Idli / dosa'].includes(m.food))G.push('Add vegetables or curd and eat them first, then the rice.');
 if(!I.length)I.push(['✅','Nothing stands out','This meal looks balanced. We will keep learning your pattern.',1]);
 return{I,G:G.slice(0,4)}}
function pose(k,p){const r=d=>d*Math.PI/180,seg=[];let head;
 if(k=='squat'){const a=r(35*p),b=r(75*p),t=r(40*p),c=r(85*p),A=[-.1,0],K=[A[0]+Math.sin(a),Math.cos(a)],H=[K[0]-Math.sin(b),K[1]+Math.cos(b)],Sh=[H[0]+1.1*Math.sin(t),H[1]+1.1*Math.cos(t)];
  seg.push([A,K],[K,H],[H,Sh],[Sh,[Sh[0]+.8*Math.sin(c),Sh[1]-.8*Math.cos(c)]]);head=[Sh[0]+.4*Math.sin(t),Sh[1]+.4*Math.cos(t)]}
 else{head=[0,3.5];seg.push([[-.5,3],[.5,3]],[[0,3],[0,1.6]],[[0,1.6],[-.3,0]],[[0,1.6],[.3,0]]);
  for(const d of[-1,1]){const S0=[.5*d,3];if(k=='curl'){const c=r(140*p),E=[S0[0]+.1*d,2],W=[E[0]-d*.3*Math.sin(c),E[1]-Math.cos(c)];seg.push([S0,E],[E,W])}
  else{const L=(a,b)=>a+(b-a)*p,E=[L(S0[0]+.6*d,S0[0]+.25*d),L(2.7,4)],W=[L(S0[0]+.6*d,S0[0]+.15*d),L(3.7,5)];seg.push([S0,E],[E,W])}}}
 const m=q=>[100+q[0]*50,230-q[1]*50];
 let s=seg.map(([a,b])=>{a=m(a);b=m(b);return `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="#3B5B4B" stroke-width="8" stroke-linecap="round"/><circle cx="${b[0]}" cy="${b[1]}" r="4.5" fill="#AA5A43"/>`}).join('');
 const h=m(head);return `<line x1="20" y1="230" x2="180" y2="230" stroke="#EEE2D6" stroke-width="3"/>${s}<circle cx="${h[0]}" cy="${h[1]}" r="13" fill="none" stroke="#3B5B4B" stroke-width="6"/>`}
const fig=(k,id)=>`<svg id="${id}" viewBox="0 0 200 250" width="100%" height="260"></svg>`;
let raf=0,t0=0,reps=0,fbk='Step into frame';
function loop(ts){if(!S.coach){return}const t=(ts-t0)/1000,p=(1-Math.cos(2*Math.PI*t/3.2))/2,el=$('#fig');if(el)el.innerHTML=pose(S.coach,p);
 if(S.cm==1){const per=4,rep=Math.floor(t/per);const shallow=(rep+1)%4==0;const ph=(t%per)/per;
  if(rep+(ph>.5?0:0)>=0){const newReps=Math.floor(t/per)-Math.floor((t/per+1)/4)+(ph>.9?1:0);if(newReps!=reps){reps=Math.max(newReps,0);const f=$('#fb'),c=$('#rc');if(c)c.textContent=reps+' / 8';
   if(f)f.textContent=((reps+0)%1==0&&shallow)?EX[S.coach].more:'Rep '+reps+'! 🎉'}}
  const f=$('#fb');if(f&&ph>.35&&ph<.6&&!shallow)f.textContent=EX[S.coach].ok}
 raf=requestAnimationFrame(loop)}
function openCoach(k){S.coach=k;S.cm=0;reps=0;S.ov='coach';draw();t0=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
function closeCoach(){if(S.cm==1&&reps>0){S.xp+=10+reps*2;S.sessions++}S.coach=null;S.ov=null;cancelAnimationFrame(raf);draw()}
function coachView(){const e=EX[S.coach];return `<div class="overlay"><div class="scroll"><div class="head"><button class="x" data-a="closeCoach">✕</button><b style="font-size:19px">${e.n}</b><span style="width:40px"></span></div>
 <div class="seg"><button class="${S.cm==0?'on':''}" data-a="cm" data-v="0">Watch demo</button><button class="${S.cm==1?'on':''}" data-a="cm" data-v="1">Check my form</button></div>
 ${S.cm==0?`<div class="card" style="padding:4px">${fig(S.coach,'fig')}</div><div class="card">${e.cues.map((c,i)=>`<div class="q"><span class="radio" style="margin:0;width:24px;height:24px;font-size:12px;background:var(--terra)">${i+1}</span>${c}</div>`).join('')}</div><button class="btn" style="margin-top:12px" data-a="cm" data-v="1">Try it with the camera<span>📷</span></button>`
 :`<div class="dark">${fig(S.coach,'fig').replace('<svg','<svg style="filter:invert(.9)"')}<div class="fb" id="fb">Step into frame</div><div style="font-size:11px;opacity:.75;margin-top:8px">Simulated here. On iPhone your front camera tracks your joints.</div></div>
 <div class="card head"><div><b id="rc" style="font-size:28px">0 / 8</b><br><small style="color:var(--muted)">clean reps</small></div><button class="btn" style="width:150px;height:46px;font-size:15px" data-a="closeCoach">Finish set<span>✓</span></button></div>`}
 </div></div>`}
function insightView(m){const r=analyze(m),h=m.rise<30?'A gentle rise':m.rise<55?'A moderate rise':'A sharp rise';
 return `<div class="overlay"><div class="scroll"><h1 style="color:var(--maroon);font-size:32px">${h}</h1><p style="color:var(--forest);font-size:15px">Your glucose moved about +${m.rise} mg/dL around this meal. Here is what may have played a part.</p>
 ${r.I.map(i=>`<div class="card ins"><span class="ico">${i[0]}</span><div style="flex:1"><div class="head"><b>${i[1]}</b><span class="dots">${[0,1,2].map(n=>`<i class="${n<i[3]?'f':''}"></i>`).join('')}</span></div><small style="color:var(--muted);font-size:13px">${i[2]}</small></div></div>`).join('')}

 if(S.stage==2)return `<div class="view warm"><div class="pad"><button class="x" style="background:none;color:#FAF3EB;margin-left:-10px" data-a="back">‹</button><small style="margin-top:20px">YOUR DASHBOARD</small><h1 style="font-family:inherit;font-size:38px;margin:6px 0 10px">Wanna switch things up?</h1><p style="font-size:15px;margin:0 0 36px">Pick the view that feels closest.<br>You can change it anytime.</p>${opt('dash',0,'📊','Simple dashboard','Calm view of meals and energy',!S.gam)}${opt('dash',1,'🌱','Gamified dashboard','Small rewards as your habits grow',S.gam)}<div style="flex:1"></div><button class="btn" data-a="next">Continue<span>→</span></button><p style="text-align:center;font-size:13px;margin:12px 0 0">Your data stays the same either way.</p></div></div>`;
 if(S.stage==3)return `<div class="view warm"><div class="pad"><button class="x" style="background:none;color:#FAF3EB;margin-left:-10px" data-a="back">‹</button><div style="height:140px;border-radius:28px;background:linear-gradient(135deg,#F7EBC8,#E8D4A8);display:flex;align-items:center;justify-content:center;gap:24px;font-size:48px;margin-top:6px">🌿🍚☀️</div><h1 style="font-size:34px;color:var(--ink);margin:18px 0 6px">What brings you here today?</h1><p style="font-size:15px;color:var(--ink);margin:0 0 18px">Pick the one that feels closest. You can change it anytime.</p>${opt('goal','meals','🍲','Understand my meals','Learn what keeps my energy steady',S.goal=='meals')}${opt('goal','habits','👣','Build gentler habits','Find a rhythm I can sustain',S.goal=='habits')}<div style="flex:1"></div><button class="btn" data-a="go">Continue<span>→</span></button></div></div>`;
 return `<div class="view">${S.ov=='coach'?coachView():''}${S.ov&&S.ov!='coach'?insightView(S.ov):''}${body()}${tabbar()}${S.prof?`<div class="overlay" style="z-index:18">${body('me')}</div>`:''}</div>`}
function body(T=S.tab){let h='';
 if(T=='home'){const q=(d,t,tab)=>`<div class="q" data-a="tab" data-v="${tab}" style="cursor:pointer"><span style="color:${d?'var(--forest)':'var(--terra)'};font-size:20px">${d?'✔':'○'}</span>${t}</div>`;
  const today=S.meals.length>0;h=hdr('Good '+(new Date().getHours()<12?'morning':new Date().getHours()<17?'afternoon':'evening'),'Your rhythm today')+
  `<div class="card"><div class="head"><span><span class="big">${cur}</span> <small style="color:var(--muted)">mg/dL ${trend}</small></span><span class="stat" style="text-align:right"><b style="color:var(--forest)">${tir}%</b><small>in range, 24h</small></span></div>${chart(80)}</div>`+
  (S.gam?`<div class="card"><div class="head"><span style="font-size:48px">${['🌱','🌿','🪴','🌳'][Math.min(3,Math.floor(S.xp/100))]}</span><span style="flex:1;margin-left:12px"><b style="font-size:18px">Level ${lvl} garden</b><br><small style="color:var(--muted)">Small steps help it grow</small></span><b style="color:var(--terra)">🔥 ${S.streak}</b></div><div class="bar"><i style="width:${S.xp%100}%"></i></div><small style="color:var(--muted);font-size:12px">${S.xp%100} / 100 XP to the next level</small></div><div class="card"><b>Today's gentle quests</b>${q(today,'Log one meal','meals')}${q(S.walks>0,'A walk after lunch','habits')}${q(S.sessions>0,'One coached exercise','habits')}</div>`
  :`<div class="row" style="margin-top:12px"><div class="card stat" style="margin:0"><b>${S.meals.length}</b><small>meals logged</small></div><div class="card stat" style="margin:0"><b>${avg}</b><small>avg mg/dL</small></div><div class="card stat" style="margin:0"><b>${S.walks}</b><small>walks done</small></div></div>`)+
  (S.meals[0]?`<div class="card"><small style="color:var(--muted)">Latest insight</small><br><b>${S.meals[0].rise<30?'A gentle rise':S.meals[0].rise<55?'A moderate rise':'A sharp rise'} after ${S.meals[0].food.toLowerCase()}</b><br><span style="color:var(--forest);font-size:14px">${analyze(S.meals[0]).I[0][2]}</span></div>`:'')+
  `<button class="btn" style="margin-top:14px" data-a="tab" data-v="${S.goal=='meals'?'meals':'habits'}">${S.goal=='meals'?'Log a meal':"Today's habit"}<span>→</span></button>`}
 if(T=='trends')h=hdr('Trends','Last 24 hours')+`<div class="card">${chart(210,1)}</div><div class="row" style="margin-top:12px"><div class="card stat" style="margin:0"><b>${tir}%</b><small>time in range</small></div><div class="card stat" style="margin:0"><b>${avg}</b><small>average</small></div><div class="card stat" style="margin:0"><b>${hi}</b><small>high readings</small></div></div><p class="tiny">Shaded band is 70–180 mg/dL. Anurja shares patterns, not medical advice.</p>`;
 if(T=='meals'){h=hdr('Understand my meals','Tell us what you eat and how it sits with you. No right answers, nothing to fix.')+`<div class="seg"><button class="${S.mealTab==0?'on':''}" data-a="mt" data-v="0">Log a meal</button><button class="${S.mealTab==1?'on':''}" data-a="mt" data-v="1">How I eat</button></div>`;
  if(S.mealTab==0)h+=`<div class="card"><b>What did you eat?</b><div class="chips">${FOODS.map(f=>chip('food',f,S.food==f)).join('')}</div></div><div class="card"><div class="chips" style="margin:0">${['Under 10 min','10–20 min','Longer'].map(f=>chip('dur',f,S.dur==f)).join('')}${CTX.map(f=>chip('ctx',f,S.ctx.includes(f))).join('')}</div></div><div class="card"><b>With the meal</b><div class="chips">${['Tea','Coffee','Juice / soft drink','Water'].map(f=>chip('drink',f,S.drink==f)).join('')}</div><div class="head" style="margin-top:12px"><span>Sugar, spoons</span><span><button class="x" data-a="sug" data-v="-1">−</button> &nbsp;<b>${S.sugar}</b>&nbsp; <button class="x" data-a="sug" data-v="1">+</button></span></div></div><div style="padding:14px 4px 0"><b style="color:var(--forest)">How do you feel now?</b><div class="chips">${['Fine','Heavy','Bloated','Acidity','Sleepy','Hungry soon'].map(f=>chip('feel',f,S.feel.includes(f),'g')).join('')}</div></div><div class="card"><b>Around this meal</b><div class="row" style="margin-top:10px"><div style="background:var(--cream);border-radius:14px;padding:10px"><small style="color:var(--muted)">Sleep last night</small><br><b>${Math.floor(S.sleep)} h ${S.sleep%1?30:0} m</b><br><button class="x" style="width:30px;height:30px" data-a="slp" data-v="-.5">−</button> <button class="x" style="width:30px;height:30px" data-a="slp" data-v=".5">+</button></div><div style="background:var(--cream);border-radius:14px;padding:10px"><small style="color:var(--muted)">Stress today</small><div class="chips" style="margin-top:4px">${['Low','Medium','High'].map(f=>chip('stress',f,S.stress==f)).join('')}</div></div></div><div class="chips"><span class="chip on">From sensor: +${rise}</span></div></div><button class="btn" style="margin-top:12px" data-a="saveMeal">Save this meal<span>›</span></button>`;
  else{const sm=[['Walked after',24],['On the move',22],['At my desk',51],['Lay down after',63],['Screen on',69]];h+=`<div class="card"><b>Average rise by habit</b>${sm.map(r=>`<div style="margin-top:10px;font-size:13px">${r[0]} <span style="float:right;color:var(--muted)">+${r[1]}</span><div class="bar"><i style="width:${r[1]}%;background:${r[1]>45?'var(--terra)':'var(--forest)'}"></i></div></div>`).join('')}<p class="tiny">Sample meals fill in until you've logged your own.</p></div><div class="card" style="background:rgba(238,226,214,.6)"><small style="color:var(--muted)">Your pattern</small><br>Meals with “walked after” rise about +24, while “screen on” average +69.</div>`}}
 if(T=='habits'){const P=['A '+S.mins+'-minute walk after lunch','10 squats before dinner','A glass of water before meals'][S.variant],why=['You eat at your desk and the canteen sets the menu, so we start after the meal.','Big leg muscles use glucose well. Short, guided sets are an easy way in.','A tiny pre-meal pause slows the first bites and is easy to repeat.'][S.variant];
  h=hdr('Build gentler habits','One small change at a time, at your pace.')+`<div class="plan"><small style="opacity:.85">Your change right now</small><div style="font-size:23px;font-weight:700;margin:4px 0 8px">${P}</div><div style="font-size:15px;opacity:.92">${why}</div><hr><div class="head"><span><small style="opacity:.8">Start with</small><br><b>${S.variant?'1 set':S.mins+' minutes'}</b></span><span><small style="opacity:.8">Grow into</small><br><b>${S.variant?'2 sets':(S.mins+5)+' minutes'}</b></span><span></span></div></div>
  <div class="card"><b style="font-size:17px">After lunch today</b><br><small style="color:var(--muted)">Did you do it?</small><div class="chips">${['Yes','A little','Not today'].map(f=>chip('did',f,S.ci.did==f)).join('')}</div><b style="display:block;margin-top:12px">How did you feel?</b><div class="chips">${['Fine','Lighter','Same','Heavy','Sleepy'].map(f=>chip('hfeel',f,S.ci.feel==f)).join('')}</div><b style="display:block;margin-top:12px">How hard was it?</b><div class="chips">${['Easy','Okay','Hard'].map(f=>chip('eff',f,S.ci.eff==f)).join('')}</div></div>
  <div class="card" style="background:var(--sand);cursor:pointer"><div class="head"><span><b>Fortnightly review</b><br><small style="color:var(--muted)">Keep it, grow it or swap it.</small></span></div><div class="chips"><button class="chip" data-a="rev" data-v="keep">Keep</button><button class="chip" data-a="rev" data-v="grow">Grow</button><button class="chip" data-a="rev" data-v="swap">Swap</button></div></div>
  <button class="btn" style="margin-top:12px" data-a="saveCi">${S.saved?'Saved':'Save check-in'}<span>${S.saved?'✓':'›'}</span></button>
  <b style="display:block;font-size:21px;margin-top:20px">Strength &amp; movement</b><p class="sub">Guided by your front camera. Video never leaves your phone.</p>${Object.entries(EX).map(([k,e])=>`<div class="card ins" style="cursor:pointer;align-items:center" data-a="coach" data-v="${k}"><span class="ico">${e.i}</span><div style="flex:1"><b>${e.n}</b><br><small style="color:var(--muted);font-size:13px">${e.b}</small></div><span style="font-size:26px;color:var(--terra)">▶</span></div>`).join('')}`}
 if(T=='me')h=hdr('Me')+`<div class="card"><b>Devices</b><div class="q">⌚ Apple Watch<span style="margin-left:auto;color:var(--forest);font-size:14px">Connected</span></div><div class="q">📡 CGM device<span style="margin-left:auto;color:var(--forest);font-size:14px">Connected</span></div></div><div class="card"><b>Dashboard</b><div class="seg"><button class="${!S.gam?'on':''}" data-a="dash" data-v="0">Simple</button><button class="${S.gam?'on':''}" data-a="dash" data-v="1">Gamified</button></div></div><div class="card"><b>What brings me here</b><div class="seg"><button class="${S.goal=='meals'?'on':''}" data-a="goal2" data-v="meals">Meals</button><button class="${S.goal=='habits'?'on':''}" data-a="goal2" data-v="habits">Habits</button></div></div><p class="tiny">Anurja is not a medical device and does not give dosing advice. Always follow your care team's guidance.</p><button class="mini" style="display:block;margin:14px auto;background:none;color:var(--terra)" data-a="restart">Restart demo</button>`;
 return `<div class="scroll">${h}</div>`}
function draw(){$('#root').innerHTML=screens();const el=$('#fig');if(el&&S.coach)el.innerHTML=pose(S.coach,0)}
function conn(k){S[k]=1;draw();setTimeout(()=>{S[k]=2;draw()},1200)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v;
 const tog=(arr,x)=>arr.includes(x)?arr.filter(y=>y!=x):[...arr,x];
 if(a=='next')S.stage++;else if(a=='back')S.stage--;else if(a=='skip'){S.watch=S.cgm=2;S.stage=2}
 else if(a=='conn'){conn(v);return}else if(a=='dash')S.gam=v=='1';else if(a=='goal')S.goal=v;else if(a=='go'){S.tab=S.goal;S.stage=4}
 else if(a=='tab'){S.tab=v;S.fab=false}else if(a=='fab'){S.fab=!S.fab}else if(a=='profile'){S.prof=true}else if(a=='closeProf'){S.prof=false}else if(a=='fabgo'){S.fab=false;if(v=='coach'){S.tab='habits';openCoach('squat');return}S.tab=v}else if(a=='mt')S.mealTab=+v;else if(a=='sug')S.sugar=Math.max(0,Math.min(6,S.sugar+ +v));else if(a=='slp')S.sleep=Math.max(2,Math.min(12,S.sleep+ +v));
 else if(a=='chip'){const g=b.dataset.g;if(g=='food')S.food=v;else if(g=='dur')S.dur=v;else if(g=='ctx')S.ctx=tog(S.ctx,v);else if(g=='drink')S.drink=S.drink==v?null:v;else if(g=='feel')S.feel=tog(S.feel,v);else if(g=='stress')S.stress=v;else if(g=='did')S.ci.did=v;else if(g=='hfeel')S.ci.feel=v;else if(g=='eff')S.ci.eff=v}
 else if(a=='saveMeal'){const m={food:S.food,dur:S.dur,ctx:[...S.ctx],drink:S.drink,sugar:S.sugar,feel:[...S.feel],sleep:S.sleep,stress:S.stress,rise};S.meals.unshift(m);S.xp+=15;S.ov=m}
 else if(a=='closeOv')S.ov=null;else if(a=='toHabits'){S.ov=null;S.tab='habits'}
 else if(a=='saveCi'){if(S.ci.did!='Not today'){S.xp+=20;S.walks++}S.saved=true;setTimeout(()=>{S.saved=false;draw()},1500)}
