<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anurja preview</title>
<style>
:root{--page:#E9E1D8;--cream:#FAF3EB;--terra:#AA5A43;--maroon:#7A1F2B;--forest:#3B5B4B;--sage:#5E7466;--sand:#EEE2D6;--blush:#E0BBA8;--ink:#2E241F;--muted:#8A7B70;--pill:#24382E;--pale:#F5EDE2;--note:#5b4d44}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#1d1815;--note:#d9cdc2}}
:root[data-theme="dark"]{--page:#1d1815;--note:#d9cdc2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--page);font-family:-apple-system,"SF Pro Text","Segoe UI",Inter,system-ui,sans-serif;display:flex;align-items:flex-start;justify-content:center;gap:22px;padding:16px;flex-wrap:wrap}

.side button:hover{border-color:var(--terra)}
#wrap{flex:none}
.phone{width:390px;height:812px;border-radius:56px;background:#111;padding:11px;box-shadow:0 0 0 2px #8a8a8f,0 24px 50px rgba(0,0,0,.35);position:relative;transform-origin:top center}

.status{position:absolute;top:14px;left:30px;right:30px;display:flex;justify-content:space-between;font-size:14px;font-weight:600;z-index:55;pointer-events:none}
.view{position:absolute;inset:0;display:flex;flex-direction:column}
.scroll{flex:1;overflow-y:auto;padding:54px 18px 120px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.bgcircle{position:absolute;width:220px;height:220px;border-radius:50%;background:rgba(238,226,214,.85);right:-90px;top:-100px;pointer-events:none}
.warm{background:linear-gradient(180deg,#AA5A43 0%,#D9A68F 45%,#3B5B4B 100%);color:var(--cream)}
.warm:before{content:"";position:absolute;width:300px;height:300px;border-radius:50%;background:rgba(94,116,102,.75);right:-110px;top:-110px}

.serif{font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif}
h1{font-size:34px;line-height:1.1;margin:0;font-weight:700}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:1.1px;margin-top:8px}
.sub{font-size:15px;color:var(--muted);margin:6px 0 0;line-height:1.35}
.warm .sub{color:var(--cream)}
.back{border:0;background:none;color:inherit;font-size:24px;width:44px;height:44px;text-align:left;padding:0;cursor:pointer}
.btn{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:58px;border:0;border-radius:30px;background:var(--terra);color:#fff;font-weight:600;font-size:17px;font-family:inherit;padding:0 26px;cursor:pointer;margin-top:12px}

.opt{display:flex;align-items:center;gap:14px;width:100%;background:#fff;border:2px solid transparent;border-radius:26px;padding:12px;text-align:left;font-family:inherit;color:var(--ink);cursor:pointer;margin-top:10px}
.opt.on{border-color:var(--terra)}
.ico{width:54px;height:54px;border-radius:16px;background:rgba(224,187,168,.6);display:grid;place-items:center;font-size:22px;flex:none}
.opt b{display:block;font-size:17px}.opt small{color:var(--muted);font-size:13px}
.radio{margin-left:auto;width:28px;height:28px;border-radius:50%;border:2px solid var(--terra);display:grid;place-items:center;color:#fff;flex:none;font-size:13px}

.head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}

.input{width:100%;min-height:46px;border-radius:24px;border:1px solid var(--sand);background:#fff;padding:0 16px;font-size:16px;font-family:inherit;color:var(--ink);margin-top:6px}
.lbl{font-size:13px;color:var(--muted);margin-top:10px}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}

.tabs{flex:1;display:flex;background:var(--pill);border-radius:40px;padding:4px;box-shadow:0 6px 16px rgba(0,0,0,.2)}
.tabs button{flex:1;height:58px;border:0;background:none;color:var(--cream);font-family:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;border-radius:50%}
.tabs button span{font-size:19px;line-height:1}
.tabs button.on{background:var(--blush);color:var(--ink);font-weight:600}
.plus{width:58px;height:58px;border-radius:50%;border:0;background:var(--terra);color:#fff;font-size:30px;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.2);flex:none}
.menu{position:absolute;right:14px;bottom:92px;background:#fff;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:40;min-width:210px;overflow:hidden}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:13px 16px;font-size:15px;font-family:inherit;color:var(--ink);cursor:pointer;border-bottom:1px solid var(--sand)}
.sheet{position:absolute;inset:0;z-index:45;display:flex;flex-direction:column;justify-content:flex-end;background:rgba(0,0,0,.25)}
.sheet .body{background:var(--cream);border-radius:28px 28px 0 0;max-height:94%;overflow-y:auto;padding:12px 20px 30px;scrollbar-width:none}
.sheet .body::-webkit-scrollbar{display:none}
.sheet.full .body{height:100%;max-height:100%;border-radius:0;padding-top:52px}
.grab{width:40px;height:5px;border-radius:3px;background:#cdbfb2;margin:0 auto 10px}
.x{width:44px;height:44px;border-radius:50%;background:#fff;border:0;font-size:16px;cursor:pointer;flex:none}
.toast{position:absolute;top:48px;left:10px;right:10px;background:rgba(250,250,250,.97);border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.25);padding:12px 14px;z-index:58;display:flex;gap:10px;animation:drop .35s ease-out;cursor:pointer}
.toast img{width:38px;height:38px;border-radius:9px}
.toast b{font-size:14px}.toast p{margin:2px 0 0;font-size:13px;color:#333}
@keyframes drop{from{transform:translateY(-120%)}to{transform:none}}
.food{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid var(--sand);border-radius:18px;padding:12px;margin-top:8px;cursor:pointer}
.food b{display:block;font-size:15px}.food small{font-size:12px;color:var(--muted)}
select.dd{min-height:46px;border-radius:24px;border:0;background:var(--terra);color:#fff;font:600 14px inherit;font-family:inherit;padding:0 12px;margin-top:6px}
.coachstage{background:#2E3A33;border-radius:26px;position:relative;aspect-ratio:3/4;margin-top:12px;overflow:hidden}
.coachstage .fb{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:var(--terra);color:#fff;border-radius:20px;padding:8px 16px;font-weight:600;font-size:15px;white-space:nowrap}
.coachstage .mv{position:absolute;left:12px;top:12px;background:rgba(0,0,0,.35);color:#fff;border-radius:14px;padding:4px 10px;font-size:12px;font-weight:600}
.num{width:28px;height:28px;border-radius:50%;background:var(--terra);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.alert{position:absolute;inset:0;background:rgba(0,0,0,.3);z-index:70;display:grid;place-items:center}
.alert div{background:rgba(245,245,245,.98);width:270px;border-radius:16px;text-align:center;padding:18px 16px 0}
.alert p{font-size:13px;margin:6px 0 14px}
.alert button{width:100%;border:0;border-top:1px solid #ddd;background:none;padding:12px;color:#0a64d8;font-size:16px;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<div class="side">
  <h3>Anurja · clickable preview</h3>
  A browser mock-up of the updated iPhone app. It runs the same trained models as the app (meal rise and activity), so suggestions and predictions are real outputs. Camera, step counting and HealthKit are simulated.
  <h3 style="margin-top:14px">Try it</h3>
  <button onclick="demo('high')">Simulate high glucose → pop-up</button>
  <button onclick="demo('low')">Simulate a low → pop-up</button>
  <button onclick="demo('normal')">Back to normal glucose</button>
  <button onclick="demo('skip')">Skip onboarding with a sample profile</button>
  <button onclick="demo('restart')">Restart from the landing page</button>
</div>
<div id="wrap"><div class="phone" id="phone"><div class="screen" id="screen"></div></div></div>

<script>
const MODELS = /*MODELS*/null;
const FOODS = /*FOODS*/null;
const LOGO = "../Anurja/Assets.xcassets/AnurjaMark.imageset/AnurjaMark.png";

// ---------------------------------------------------------------- ML (same networks as MLEngine.swift)
function forward(net, x){
  const h = net.b1.slice();
  for (let i=0;i<x.length;i++){ const z=(x[i]-net.mean[i])/(net.scale[i]||1); const r=net.w1[i]; for(let j=0;j<h.length;j++) h[j]+=z*r[j]; }
  const o = net.b2.slice();
  for (let j=0;j<h.length;j++){ const a=Math.max(0,h[j]); if(!a) continue; for(let k=0;k<o.length;k++) o[k]+=a*net.w2[j][k]; }
  return o;
}
function softmax(v){ const m=Math.max(...v); const e=v.map(x=>Math.exp(x-m)); const s=e.reduce((a,b)=>a+b,0); return e.map(x=>x/s); }
const STRESS={Low:0,Medium:1,High:2};
function riseFeatures(item, m){
  const serv=m.servings||1, carbs=m.carbs!=null?m.carbs:item.carbs*serv, c=m.contexts||[];
  return [carbs, carbs*item.gi/100, item.fiber*serv, item.protein*serv, item.fat*serv,
    m.duration==='Under 10 min'?1:0, m.duration==='Longer'?1:0,
    c.includes('At my desk')?1:0, c.includes('Screen on')?1:0, c.includes('On the move')?1:0, c.includes('Walked after')?1:0, c.includes('Lay down after')?1:0,
    m.drink==='Juice / soft drink'?1:0, m.sugar||0, Math.max(0,7-(m.sleep??7)), STRESS[m.stress||'Medium'], (m.hour>=5&&m.hour<11)?1:0];
}
const food = id => FOODS.find(f=>f.id===id);
function popRise(item,m){ return Math.max(0, forward(MODELS.rise, riseFeatures(item,m))[0]); }
function personaliser(meals){
  const res={}; let all=[];
  meals.forEach(m=>{ const it=food(m.foodId); const r=m.rise-popRise(it,m); (res[m.foodId]=res[m.foodId]||[]).push(r); all.push(r); });
  const user = all.length? all.reduce((a,b)=>a+b,0)/(all.length+5):0;
  const per={}; for(const k in res) per[k]=res[k].reduce((a,b)=>a+b,0)/(res[k].length+3);
  return {count:all.length, adjust:(id,raw)=> raw + (id in per ? per[id] : user)};
}
function riseTitle(r){ return r<30?'A gentle rise':r<55?'A moderate rise':'A sharp rise'; }
const ACTIONS={
  high:[["🚶","Brisk walk, 10–15 minutes","Working muscles pull glucose out of your blood."],["🪜","Climb stairs for 5 minutes","Short, strong bursts help bring it down."],["💧","Drink a glass of water","Staying hydrated helps your body clear extra glucose."]],
  rising:[["🚶","Light walk, 5–10 minutes","A short walk now can flatten the rise."],["🏋️","10 slow squats","Big leg muscles soak up glucose.","squat"],["💧","Drink a glass of water","Skip sweet drinks for now."]],
  low:[["🧃","Eat 15 g of quick carbs","Half a glass of juice, 3 glucose tablets or 1 tbsp sugar."],["🪑","Sit down and rest","Recheck in 15 minutes. Follow your care team's plan."]],
  in_range:[["🌿","Keep doing what you're doing","A short walk after your next meal keeps it steady."]]
};
const STATUS_TITLE={in_range:"You're in your target range",rising:"Heading towards your upper target",high:"Above your target range",low:"Below your target range"};
function activity(){
  const pts=S.points, g=pts[pts.length-1].v, now=pts[pts.length-1].t;
  const w=pts.filter(p=>now-p.t<=30*60e3); const slope=(w[w.length-1].v-w[0].v)/((w[w.length-1].t-w[0].t)/60e3)*5;
  const last=S.meals.length?Math.max(...S.meals.map(m=>m.date)):null;
  const minutes= last? Math.max(0,(Date.now()-last)/60e3):600;
  const fasting=minutes>=240, d=new Date(), hour=d.getHours()+d.getMinutes()/60, a=2*Math.PI*hour/24;
  const p=softmax(forward(MODELS.activity,[g,slope,Math.min(minutes,600)/60,fasting?1:0,S.stepsLastHour/1000,Math.sin(a),Math.cos(a)]));
  const classes=["in_range","rising","high","low"]; let best=p.indexOf(Math.max(...p)); let status=classes[best];
  if(g<70) status='low';
  return {status, conf:p[best], fasting, low:70, high:fasting?130:180, g};
}

// ---------------------------------------------------------------- glucose simulation (GlucoseMath.simulated)
function simulate(offset=0){
  const events=[[3.5,-20],[8.5,52],[13,78],[16.5,28],[20.5,60]], steps=96*7, now=Date.now(), pts=[];
  for(let i=-steps;i<=0;i++){
    const t=now+i*900e3, d=new Date(t), hour=d.getHours()+d.getMinutes()/60, day=Math.floor((i+steps)/96), scale=1+.18*Math.sin(day*1.7);
    let v=104+5*Math.sin(hour*.9)+2*Math.sin(i*1.7);
    for(const [h,amp] of events){ let dl=((hour-h)%24+24)%24; if(dl<4) v+=amp*scale*(dl/.9)*Math.exp(1-dl/.9); }
    pts.push({t,v});
  }
  if(offset){ const n=pts.length; for(let k=0;k<8;k++){ pts[n-8+k].v += offset*(k+1)/8; } }
  return pts;
}
const within=(h)=>{ const end=S.points[S.points.length-1].t; return S.points.filter(p=>end-p.t<=h*3600e3); };
const tir=pts=>Math.round(pts.filter(p=>p.v>=70&&p.v<=180).length/pts.length*100);
const mean=pts=>pts.reduce((a,p)=>a+p.v,0)/pts.length;
const gmi=pts=>(3.31+0.02392*mean(pts));
function forecastTone(){
  const pts=S.points, last=pts[pts.length-1]; const w=pts.filter(p=>last.t-p.t<=30*60e3);
  const xs=w.map(p=>(p.t-last.t)/60e3), ys=w.map(p=>p.v), mx=xs.reduce((a,b)=>a+b)/xs.length, my=ys.reduce((a,b)=>a+b)/ys.length;
  let num=0,den=0; xs.forEach((x,i)=>{num+=(x-mx)*(ys[i]-my);den+=(x-mx)**2}); const slope=den?num/den:0;
  const end=last.v+slope*20*(1-Math.exp(-60/20));
  const fc=[]; for(let s=1;s<=12;s++){ const m=s*5; fc.push({t:last.t+m*60e3,v:Math.min(350,Math.max(40,last.v+slope*20*(1-Math.exp(-m/20))))}); }
  return {tone:end>last.v+3?'rising':end<last.v-3?'falling':'steady', fc};
}
const TONE={rising:["↗","Next hour: likely to rise","Heading up after your last meal"],falling:["↘","Next hour: likely to fall","Easing down"],steady:["→","Next hour: likely to stay steady","Looking steady"]};
function peaks(pts){
  let top=pts[0],bot=pts[0]; pts.forEach(p=>{if(p.v>top.v)top=p; if(p.v<bot.v)bot=p;});
  const before=pts.filter(p=>top.t-p.t<=2*3600e3&&p.t<=top.t); const base=Math.min(...before.map(p=>p.v));
  const b2=pts.filter(p=>bot.t-p.t<=2*3600e3&&p.t<bot.t); const base2=b2.length?mean(b2):bot.v;
  const meal=S.meals.filter(m=>top.t-m.date>=0&&top.t-m.date<=3*3600e3).sort((a,b)=>b.date-a.date)[0];
  return {top, up:Math.round(top.v-base), meal, bot, down:Math.round(bot.v-base2)};
}

// ---------------------------------------------------------------- chart
function chart(pts, range, h, opts={}){
  const W=330, H=h, L=opts.axes?28:4, R=6, T=6, B=opts.axes?22:6;
  const fc=opts.forecast||[]; const t0=pts[0].t, t1=(fc.length?fc[fc.length-1].t:pts[pts.length-1].t);
  const x=t=>L+(t-t0)/(t1-t0)*(W-L-R), y=v=>T+(1-(v-50)/200)*(H-T-B);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" style="display:block">`;
  s+=`<rect x="${L}" y="${y(180)}" width="${W-L-R}" height="${y(70)-y(180)}" fill="rgba(59,91,75,.09)"/>`;
  if(opts.axes){
    [70,180].forEach(v=>{s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#EEE2D6"/><text x="${L-4}" y="${y(v)+4}" font-size="10" fill="#8A7B70" text-anchor="end">${v}</text>`});
    const step = range==='week'?24:range==='twelve'?3:6; const d=new Date(t0); d.setMinutes(0,0,0);
    if(range==='week'){d.setHours(0);}
    for(let t=d.getTime(); t<=t1; t+=3600e3){
      const dd=new Date(t); if(t<t0) continue;
      if(range==='week'? dd.getHours()!==0 : dd.getHours()%step!==0) continue;
      const lab= range==='week'? dd.toLocaleDateString('en',{weekday:'short'}) : dd.toLocaleTimeString('en',{hour:'numeric'}).replace(' ',' ');
      s+=`<line x1="${x(t)}" x2="${x(t)}" y1="${T}" y2="${H-B}" stroke="#EEE2D6"/><text x="${x(t)}" y="${H-6}" font-size="10" fill="#8A7B70" text-anchor="middle">${lab}</text>`;
    }
    if(opts.unit) s+=`<text x="2" y="${T+8}" font-size="9" fill="#8A7B70">mg/dL</text>`;
  }
  s+=`<path d="${pts.map((p,i)=>(i?'L':'M')+x(p.t).toFixed(1)+' '+y(p.v).toFixed(1)).join('')}" fill="none" stroke="#AA5A43" stroke-width="${range==='week'?1.4:2.4}" stroke-linejoin="round"/>`;
  if(fc.length){ const f=[pts[pts.length-1],...fc]; s+=`<path d="${f.map((p,i)=>(i?'L':'M')+x(p.t).toFixed(1)+' '+y(p.v).toFixed(1)).join('')}" fill="none" stroke="#3B5B4B" stroke-width="2" stroke-dasharray="5 4"/>`; }
  (opts.meals||[]).forEach(m=>{ if(m.date<t0) return; const p=pts.reduce((a,b)=>Math.abs(b.t-m.date)<Math.abs(a.t-m.date)?b:a); s+=`<circle cx="${x(p.t)}" cy="${y(p.v)}" r="4" fill="#7A1F2B"/>`; });
  return s+'</svg>';
}

function whatHelps(){
  const meals=learning(), per=personaliser(meals);
  const typ={servings:1,duration:'10–20 min',contexts:[],drink:'Water',sugar:0,sleep:7,stress:'Medium',hour:13};
  const scored=FOODS.filter(safe).map(f=>({f,rise:Math.round(Math.max(0,per.adjust(f.id,popRise(f,typ))))})).sort((a,b)=>a.rise-b.rise);
  const mains=scored.filter(s=>!['Snacks','Drinks','Sweets','Fruits'].includes(s.f.category)).slice(0,4);
  const snack=scored.find(s=>s.f.category==='Snacks');
  const g={}; meals.forEach(m=>(g[m.foodId]=g[m.foodId]||[]).push(m.rise));
  const comps=Object.entries(g).map(([id,r])=>{const f=food(id), avg=Math.round(r.reduce((a,b)=>a+b)/r.length); const sw=scored.find(s=>s.f.category===f.category&&s.f.id!==id&&s.rise<avg); return {f,avg,sw};}).sort((a,b)=>b.avg-a.avg).slice(0,4);
  const ctx=['At my desk','Screen on','On the move','Walked after','Lay down after'];
  const habits=ctx.map(c=>{const w=meals.filter(m=>m.contexts.includes(c)).map(m=>m.rise), wo=meals.filter(m=>!m.contexts.includes(c)).map(m=>m.rise); if(!w.length||!wo.length) return null; const a=w.reduce((x,y)=>x+y)/w.length, b=wo.reduce((x,y)=>x+y)/wo.length; return {c,w:Math.round(a),d:Math.round(a-b)};}).filter(Boolean).sort((a,b)=>a.d-b.d);
  const maxW=Math.max(80,...habits.map(h=>h.w));

function linkInsulin(t){

  if(before&&(!after||before[1]<=after[1])) return {rel:'pre_meal',text:`Taken ${Math.round(before[1])} min before ${nm(before[0])}`};
  if(after) return {rel:'post_meal',text:`Taken ${Math.round(after[1])} min after ${nm(after[0])}`};
  const act=[...S.sessions.map(s=>s.date),...S.checkins.map(c=>c.date)].map(d=>Math.abs(d-t)/60e3).filter(x=>x<=60);

// ---------------------------------------------------------------- coach
function stickSVG(kind, p, color){
  const L=(a,b,c)=>a+(b-a)*c, P=(x,y)=>[x,y], lp=(a,b)=>[L(a[0],b[0],p),L(a[1],b[1],p)];
  let seg=[], head=[0,3.5], props=[];
  const squat=q=>{const sh=35*q*Math.PI/180,th=75*q*Math.PI/180,to=40*q*Math.PI/180,ar=85*q*Math.PI/180;const an=[-.1,0],kn=[an[0]+Math.sin(sh),Math.cos(sh)],hp=[kn[0]-Math.sin(th),kn[1]+Math.cos(th)],so=[hp[0]+1.1*Math.sin(to),hp[1]+1.1*Math.cos(to)],ha=[so[0]+.8*Math.sin(ar),so[1]-.8*Math.cos(ar)];return {seg:[[an,kn],[kn,hp],[hp,so],[so,ha]],head:[so[0]+.4*Math.sin(to),so[1]+.4*Math.cos(to)]};};
  const torso=()=>[[P(-.5,3),P(.5,3)],[P(0,3),P(0,1.6)],[P(0,1.6),P(-.3,0)],[P(0,1.6),P(.3,0)]];
  if(kind==='squat'||kind==='chairStand'){const r=squat(kind==='squat'?p:p*.8);seg=r.seg;head=r.head;if(kind==='chairStand')props=[[P(-1.25,1.1),P(-.4,1.1)],[P(-1.25,1.1),P(-1.25,0)],[P(-.45,1.1),P(-.45,0)],[P(-1.25,1.1),P(-1.25,2.3)]];}
  else if(kind==='lunge'){const hip=lp(P(0,1.95),P(0,1.4)),fk=lp(P(.4,1),P(.78,.8)),bk=lp(P(-.42,1),P(-.6,.4)),sh=[hip[0]+.05,hip[1]+1.1];seg=[[P(.75,0),fk],[fk,hip],[P(-.85,0),bk],[bk,hip],[hip,sh],[sh,[sh[0]+.1,sh[1]-.85]]];head=[sh[0]+.05,sh[1]+.4];}
  else if(kind==='wallPushup'){const ft=P(-.9,0),hd=P(1.35,2.6),sh=lp(P(.45,2.75),P(.9,2.55)),hp=[(ft[0]+sh[0])/2,(ft[1]+sh[1])/2],el=lp(P(.9,2.68),P(1.05,2.15)),dx=sh[0]-ft[0],dy=sh[1]-ft[1],l=Math.hypot(dx,dy);seg=[[ft,hp],[hp,sh],[sh,el],[el,hd]];head=[sh[0]+dx/l*.4,sh[1]+dy/l*.4];props=[[P(1.5,0),P(1.5,4.2)]];}
  else if(kind==='march'){const kl=lp(P(-.28,.85),P(-.3,1.75)),fl=lp(P(-.3,0),P(-.35,.9));seg=[[P(-.5,3),P(.5,3)],[P(0,3),P(0,1.7)],[P(-.25,1.7),P(.25,1.7)],[P(-.25,1.7),kl],[kl,fl],[P(.25,1.7),P(.28,.85)],[P(.28,.85),P(.3,0)],[P(-.5,3),P(-.7,2.2)],[P(.5,3),P(.7,2.2)]];}
  else if(kind==='lateralRaise'){seg=torso();const r=L(12,88,p)*Math.PI/180;for(const s of[-1,1]){const sh=P(.5*s,3);seg.push([sh,[sh[0]+s*.7*Math.sin(r),sh[1]-.7*Math.cos(r)]]);seg.push([[sh[0]+s*.7*Math.sin(r),sh[1]-.7*Math.cos(r)],[sh[0]+s*1.35*Math.sin(r),sh[1]-1.35*Math.cos(r)]]);}}
  else {seg=torso();for(const s of[-1,1]){const sh=P(.5*s,3);if(kind==='press'){const el=[L(sh[0]+.6*s,sh[0]+.25*s,p),L(2.7,4,p)],wr=[L(sh[0]+.6*s,sh[0]+.15*s,p),L(3.7,5,p)];seg.push([sh,el],[el,wr]);}else{const c=140*p*Math.PI/180,el=[sh[0]+.1*s,2],wr=[el[0]-s*.3*Math.sin(c),el[1]-Math.cos(c)];seg.push([sh,el],[el,wr]);}}}
  const m=q=>[(100+q[0]*50)*1.6,(260-q[1]*50)*1.2]; let s=`<svg viewBox="0 0 320 330" width="100%" style="display:block"><line x1="16" x2="304" y1="${m([0,0])[1]}" y2="${m([0,0])[1]}" stroke="#EEE2D6" stroke-width="3"/>`;
  props.forEach(([a,b])=>{const A=m(a),B=m(b);s+=`<line x1="${A[0]}" y1="${A[1]}" x2="${B[0]}" y2="${B[1]}" stroke="#EEE2D6" stroke-width="6" stroke-linecap="round"/>`});
  seg.forEach(([a,b])=>{const A=m(a),B=m(b);s+=`<line x1="${A[0]}" y1="${A[1]}" x2="${B[0]}" y2="${B[1]}" stroke="${color}" stroke-width="9" stroke-linecap="round"/><circle cx="${B[0]}" cy="${B[1]}" r="4.5" fill="#AA5A43"/>`});
  const H=m(head); return s+`<circle cx="${H[0]}" cy="${H[1]}" r="17" fill="none" stroke="${color}" stroke-width="6"/></svg>`;
}

let raf=null;
function coachLoop(){
  const C=S.coach; if(!C){raf=null;return;} const e=EX.find(x=>x[0]===C.kind), el=document.getElementById('stick');
  const t=(performance.now()-C.t0)/1000;
  if(C.mode==='demo'){ if(el) el.innerHTML=stickSVG(C.kind,(1-Math.cos(2*Math.PI*t/3.2))/2,'#3B5B4B'); }
  else {
    const hi=e[5], lo=e[6], period=4, phase=(t%period)/period, cycle=Math.floor(t/period)+1, shallow=cycle%4===0;
    const bottom=shallow?(hi+lo)/2+6:lo-4, ang=bottom+(hi+5-bottom)*(1+Math.cos(2*Math.PI*phase))/2;
    const prog=Math.min(1,Math.max(0,(hi+5-ang)/(hi+5-(lo-4))));
    if(el) el.innerHTML=stickSVG(C.kind,prog,'#FAF3EB');
    // RepCounter (smoothing + full range + tempo)
    const prev=C.sm??ang, a=prev+.45*(ang-prev); C.sm=a;
    if(!C.inRep&&a<hi-15){C.inRep=true;C.reached=false;C.start=t;C.fb='Keep going…';}
    if(C.inRep&&a<lo){C.reached=true;C.fb=({squat:'Good depth, now stand tall',chairStand:'Nice, now stand up tall',lunge:'Good depth, push back up',march:'Good height, lower slowly',wallPushup:'Nice, push back out',curl:'Nice squeeze, lower slowly',press:'Strong press, lower back down',lateralRaise:'Shoulder height, now lower slowly'})[C.kind];}
    if(C.inRep&&a>hi){ if(C.reached){C.count++;C.fb=C.count>=e[7]?`Set complete! ${C.count} reps`:`Rep ${C.count}!`;} else C.fb=({squat:'Go a little lower next time',chairStand:'Stand all the way up, then sit',lunge:'Drop the back knee a little more',march:'Lift your knee a bit higher',wallPushup:'Bring your chest closer to the wall',curl:'Curl a bit higher',press:'Lower your hands to shoulder level',lateralRaise:'Raise your arms to shoulder height'})[C.kind]; C.inRep=false;C.reached=false;}
    const fb=document.getElementById('fb'); if(fb) fb.textContent=C.fb;
    const cnt=document.getElementById('cnt'); if(cnt) cnt.textContent=`${C.count} / ${e[7]}`;
    const bar=document.getElementById('cbar'); if(bar) bar.style.width=Math.min(100,C.count/e[7]*100)+'%';
  }
  raf=requestAnimationFrame(coachLoop);
}

function serv(d){ S.add.servings=Math.min(4,Math.max(.5,S.add.servings+d)); if(!S.add.edited) S.add.carbs=Math.round(food(S.add.foodId).carbs*S.add.servings); render(); }
function toggleCtx(c){ const a=S.add.contexts; a.includes(c)?a.splice(a.indexOf(c),1):a.push(c); render(); }
function toggleFeel(c){ const a=S.add.feel; a.includes(c)?a.splice(a.indexOf(c),1):a.push(c); render(); }
function draft(){ const A=S.add; return {servings:A.servings,carbs:A.carbs,duration:A.duration,contexts:A.contexts,drink:A.drink,sugar:A.sugar,sleep:A.sleep,stress:A.stress,hour:new Date().getHours()}; }
function sensorRise(){ const w=within(2); return Math.round(Math.max(...w.map(p=>p.v))-Math.min(...w.map(p=>p.v))); }
function saveMeal(){ const A=S.add, f=food(A.foodId), m=draft(); const pred=Math.round(Math.max(0,personaliser(learning()).adjust(f.id,popRise(f,m))));
  // demo: the "sensor" rise is the model's view plus a little personal noise
  const rise=Math.max(5,Math.round(pred+(Math.random()*16-8)));
  const meal={...m,id:'m'+Date.now(),date:Date.now(),foodId:A.foodId,rise,pred,photo:!!A.photo,feel:A.feel};
  S.meals.unshift(meal); S.sheet=null; render(); setTimeout(()=>{S.insightId=meal.id; openSheet('insight');},350); }
function saveInsulin(title,rel){ const l=linkInsulin(S.ins.time); S.insulin.unshift({date:S.ins.time,units:S.ins.units,relation:rel,relationTitle:title}); closeSheet(); }
function openInsight(id){ S.insightId=id; openSheet('insight'); }
function saveCheckin(btn){ S.checkins.unshift({date:Date.now(),did:S.did,feel:S.feel,effort:S.effort,steps:S.steps}); btn.innerHTML='Saved <span>✓</span>'; setTimeout(render,1300); }
function openCoach(kind){ S.menu=false; S.coach={kind,mode:'demo',t0:performance.now(),count:0,fb:'Step into frame',alert:false}; if(S.tab!=='home') S.tab='habits'; S._keepScroll=false; _render(); }
function coachMode(m){ Object.assign(S.coach,{mode:m,t0:performance.now(),count:0,fb:'Step into frame',sm:null,inRep:false,reached:false}); _render(); }
function finishSet(){ S.coach.alert=true; if(S.coach.count) S.sessions.unshift({date:Date.now(),kind:S.coach.kind,reps:S.coach.count}); cancelAnimationFrame(raf); raf=null; _render(); }
function closeCoach(){ S.coach=null; cancelAnimationFrame(raf); raf=null; _render(); }
function maybeNotify(){ const a=activity(); if(S.stage!=='main'||!S.profile.alerts||(a.status!=='high'&&a.status!=='low')) return;
  S.toast={t:STATUS_TITLE[a.status],b:`${Math.round(a.g)} mg/dL. ${ACTIONS[a.status].slice(0,2).map(x=>x[1]).join(' · ')}`}; render(); setTimeout(()=>{S.toast=null;render();},6000); }
function demo(kind){
  if(kind==='restart'){ cancelAnimationFrame(raf); raf=null; S=fresh(); _render(); return; }
  if(kind==='skip'){ Object.assign(S.profile,{name:'Asha Rao',age:41,h:160,w:62,allergies:['peanut'],insulin:true,itype:'rapid',meds:[{name:'Metformin',dose:'500 mg',timing:'With meals'}]}); S.watch=S.cgm='connected'; finish(); return; }
  S.points=simulate(kind==='high'?110:kind==='low'?-60:0);
  if(S.stage!=='main') demo('skip'); else { S.tab='home'; S.sheet=null; S._keepScroll=false; _render(); setTimeout(maybeNotify,400); }
}
function fit(){ const ph=document.getElementById('phone'), s=Math.min(1,(window.innerHeight-32)/834); ph.style.transform=`scale(${s})`; document.getElementById('wrap').style.height=(834*s)+'px'; document.getElementById('wrap').style.width=(412*s)+'px'; ph.style.transformOrigin='top left'; }
window.addEventListener('resize',fit); fit(); _render();
</script>
